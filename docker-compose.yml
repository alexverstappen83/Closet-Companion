services:
  web:
    build: .
    container_name: app1-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Alleen bereikbaar via de lokale reverse proxy (Caddy), niet publiek.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - /data/app1/uploads:/data/app1/uploads
      - /data/app1/generated:/data/app1/generated
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: app1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app1}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - /data/app1/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app1}"]
      interval: 10s
      timeout: 5s
      retries: 5
