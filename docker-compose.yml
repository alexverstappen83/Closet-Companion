services:
  app1-web:
    build: .
    image: app1-web
    container_name: app1-web
    restart: unless-stopped
    env_file:
      - .env
    # Migreert het schema en start daarna de server. Roept de Prisma CLI
    # rechtstreeks aan, zodat geen npx-shim in het runtime-image nodig is.
    entrypoint:
      - /bin/sh
      - -c
      - node node_modules/prisma/build/index.js db push --skip-generate && exec node server.js
    volumes:
      - /data/app1/uploads:/data/app1/uploads
      - /data/app1/generated:/data/app1/generated
    networks:
      # 'edge' = gedeeld netwerk met mamuth-caddy; 'default' = privé voor de DB.
      - default
      - edge
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: app1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app1}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - /data/app1/postgres:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app1}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Bestaand netwerk van de mamuth-caddy reverse proxy (extern beheerd).
  edge:
    external: true
  # Privénetwerk voor verkeer tussen de app en de database.
  default:
    driver: bridge
